name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      # The suite is standard-library only and touches no sockets, so it runs
      # unchanged on a sandboxed runner with no network egress.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        run: |
          netprobe --version
          netprobe subnet 10.0.0.0/24
          netprobe --json subnet 192.168.1.0/31
          netprobe mac 00:0c:29:ab:cd:ef
        shell: bash

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check .

      - name: Check the package builds
        run: |
          python -m pip install build
          python -m build
